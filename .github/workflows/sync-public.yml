name: Sync to Public Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Public Mirror
        run: |
          git config --global user.name "zayyanathariz63-pixel"
          git config --global user.email "zayyanathariz63@gmail.com"
          git remote add public https://x-access-token:${{ secrets.ACCESS_TOKEN_PUBLIC_REPO }}@github.com/zayyanathariz63-pixel/bluefox-public.git
          git push public main --force
