<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncing Session...</title>
    <!-- Load Supabase and Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 flex flex-col items-center justify-center min-h-screen p-4 font-sans">
    <div class="max-w-md w-full bg-slate-800/60 backdrop-blur-md rounded-2xl p-8 border border-slate-700/50 shadow-2xl text-center space-y-6">
        <div class="loading-container flex flex-col items-center space-y-4">
            <svg class="animate-spin h-10 w-10 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h1 class="text-xl font-semibold tracking-tight text-white">Menghubungkan Sesi SSO...</h1>
            <p id="status-text" class="text-slate-400 text-sm">Menghubungi Pusat Login untuk sinkronisasi data...</p>
        </div>
    </div>

    <script>
        // Fungsi pintar untuk membaca parameter di URL (? atau #)
        const getParam = (name) => {
            const results = new RegExp('[?&#]' + name + '=([^&#]*)').exec(window.location.href);
            return results ? decodeURIComponent(results[1]) : null;
        };

        async function terimaLaporanPusat() {
            const statusText = document.getElementById('status-text');
            
            // Mengambil hash setelah simbol '#' dan memecahkannya
            const hashFragment = window.location.hash.substring(1); 
            let urlParams = new URLSearchParams(hashFragment);
            
            let status = urlParams.get('status');
            let accessToken = urlParams.get('access_token');
            let refreshToken = urlParams.get('refresh_token');

            // Fallback for query parameters if they aren't in the hash
            if (!accessToken) {
                const searchParams = new URLSearchParams(window.location.search);
                status = status || searchParams.get('status');
                accessToken = searchParams.get('access_token');
                refreshToken = searchParams.get('refresh_token');
            }

            if (status === 'valid' && accessToken && refreshToken) {
                console.log("Token berhasil didapatkan secara aman:", accessToken);
                if (statusText) statusText.innerText = "Sesi valid! Memasang kunci keamanan...";

                try {
                    // Dapatkan konfigurasi Supabase secara dinamis dari backend server
                    const configRes = await fetch('/api/config');
                    let supabaseUrl = '';
                    let supabaseKey = '';
                    
                    if (configRes.ok) {
                        const configData = await configRes.json();
                        supabaseUrl = configData.supabaseUrl;
                        supabaseKey = configData.supabaseAnonKey;
                    }

                    // Fallback jika API gagal
                    if (!supabaseUrl || !supabaseKey) {
                        supabaseUrl = 'https://dummy.supabase.co';
                        supabaseKey = 'dummy_anon_key';
                    }

                    // Buat supabase client secara dinamis
                    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

                    // Meminta Supabase lokal TMPA Chat untuk mengunci token yang diberikan pusat
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (!error) {
                        if (statusText) statusText.innerText = "Sinkronisasi berhasil! Mengalihkan ke ruang chat...";
                        // BERHASIL! Sekarang TMPA Chat sudah memegang data user secara sah
                        // Langsung buang histori URL bermuatan token dan masuk ke dashboard chat
                        setTimeout(() => {
                            window.location.href = "/";
                        }, 800);
                    } else {
                        console.error("Gagal mengunci sesi lokal:", error.message);
                        window.location.href = "/?error=sync_failed";
                    }
                } catch (e) {
                    console.error("Kesalahan jaringan/sistem:", e);
                    window.location.href = "/?error=sync_failed";
                }
            } else {
                // Jika laporannya palsu atau eror, pulangkan ke halaman awal biar login manual
                window.location.href = "/?error=unauthorized";
            }
        }

        // Jalankan fungsi otomatis saat halaman terbuka
        terimaLaporanPusat();
    </script>
</body>
</html>
